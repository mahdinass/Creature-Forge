[project]
name = "creature-forge"
version = "0.0.1"
description = "Physics-grounded robot failure investigation (Phase 0: MuJoCo foundation)"
requires-python = ">=3.11"
dependencies = ["mujoco>=3.2,<4", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["creature_forge"]
