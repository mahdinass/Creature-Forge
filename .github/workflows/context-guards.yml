name: Context safeguards

on:
  push:
  pull_request:

jobs:
  test-context-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run memory and environment guard tests
        run: python -m unittest discover -s tests -v
      - name: Session preflight smoke test
        run: python scripts/context_preflight.py
